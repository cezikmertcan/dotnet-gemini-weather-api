name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GeminiWeatherApi.sln

      - name: Build
        run: dotnet build GeminiWeatherApi.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test GeminiWeatherApi.sln --no-build --configuration Release

      - name: Build Docker image
        run: docker build --tag gemini-weather-api:ci .
